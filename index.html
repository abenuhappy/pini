<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pini Hub</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Pretendard:wght@300;400;600;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --card-hover: rgba(255, 255, 255, 0.1);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-1: #3b82f6;
            /* Blue for Card */
            --accent-2: #10b981;
            /* Green for Edu */
            --accent-3: #f59e0b;
            /* Amber for Eye */
            --accent-4: #ec4899;
            /* Pink for Hanja */
            --accent-5: #8b5cf6;
            /* Purple for Periodic */
            --accent-6: #14b8a6;
            /* Teal for Jump Game */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', 'Outfit', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1.5rem;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            animation: fadeInDown 0.8s ease-out;
        }

        .title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            background: linear-gradient(to right, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .hub-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .hub-card {
            display: flex;
            align-items: center;
            padding: 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            text-decoration: none;
            color: var(--text-primary);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.5s ease-out forwards;
        }

        /* Animation Delays for Staggered Effect */
        .hub-card:nth-child(1) {
            animation-delay: 0.1s;
        }

        .hub-card:nth-child(2) {
            animation-delay: 0.2s;
        }

        .hub-card:nth-child(3) {
            animation-delay: 0.3s;
        }

        .hub-card:nth-child(4) {
            animation-delay: 0.4s;
        }

        .hub-card:nth-child(5) {
            animation-delay: 0.5s;
        }

        .hub-card:nth-child(6) {
            animation-delay: 0.6s;
        }

        .hub-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            transition: width 0.3s ease;
        }

        .card-1::before {
            background-color: var(--accent-1);
        }

        .card-2::before {
            background-color: var(--accent-2);
        }

        .card-3::before {
            background-color: var(--accent-3);
        }

        .card-4::before {
            background-color: var(--accent-4);
        }

        .card-5::before {
            background-color: var(--accent-5);
        }

        .card-6::before {
            background-color: var(--accent-6);
        }

        .hub-card:hover {
            transform: translateY(-5px);
            background: var(--card-hover);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .hub-card:hover::before {
            width: 6px;
        }

        .card-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-right: 1.25rem;
            background: rgba(255, 255, 255, 0.1);
        }

        .card-1 .card-icon {
            color: var(--accent-1);
        }

        .card-2 .card-icon {
            color: var(--accent-2);
        }

        .card-3 .card-icon {
            color: var(--accent-3);
        }

        .card-4 .card-icon {
            color: var(--accent-4);
        }

        .card-5 .card-icon {
            color: var(--accent-5);
        }

        .card-6 .card-icon {
            color: var(--accent-6);
        }

        .card-content {
            flex-grow: 1;
        }

        .card-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .card-desc {
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .card-arrow {
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: transform 0.3s ease, color 0.3s ease;
        }

        .hub-card:hover .card-arrow {
            transform: translateX(4px);
            color: var(--text-primary);
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ambient Glow */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw;
            max-width: 600px;
            max-height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="ambient-glow"></div>

    <header class="header">
        <h1 class="title">Pini Hub</h1>
        <p class="subtitle">모든 서비스를 한 곳에서</p>
    </header>

    <main class="hub-container">
        <!-- Card 1: 카드 정산 -->
        <a href="https://card-t.vercel.app/" class="hub-card card-1" target="_blank" rel="noopener noreferrer">
            <div class="card-icon">💳</div>
            <div class="card-content">
                <h2 class="card-title">카드 정산</h2>
                <p class="card-desc">간편한 카드 내역 관리</p>
            </div>
            <div class="card-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </div>
        </a>

        <!-- Card 2: 학원 결제 -->
        <a href="https://edu-c-phi.vercel.app/" class="hub-card card-2" target="_blank" rel="noopener noreferrer">
            <div class="card-icon">🎓</div>
            <div class="card-content">
                <h2 class="card-title">학원 결제</h2>
                <p class="card-desc">손쉬운 학원비 관리</p>
            </div>
            <div class="card-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </div>
        </a>

        <!-- Card 3: 시력 운동 -->
        <a href="https://eye-g-amber.vercel.app/" class="hub-card card-3" target="_blank" rel="noopener noreferrer">
            <div class="card-icon">👀</div>
            <div class="card-content">
                <h2 class="card-title">시력 운동</h2>
                <p class="card-desc">눈 건강을 위한 루틴</p>
            </div>
            <div class="card-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </div>
        </a>

        <!-- Card 4: 한자 학습 -->
        <a href="https://hanja-silk.vercel.app/" class="hub-card card-4" target="_blank" rel="noopener noreferrer">
            <div class="card-icon">✍️</div>
            <div class="card-content">
                <h2 class="card-title">한자 학습</h2>
                <p class="card-desc">매일매일 한자 마스터</p>
            </div>
            <div class="card-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </div>
        </a>

        <!-- Card 5: 원소 기호 -->
        <a href="https://periodic-omega.vercel.app/" class="hub-card card-5" target="_blank" rel="noopener noreferrer">
            <div class="card-icon">🧪</div>
            <div class="card-content">
                <h2 class="card-title">원소 기호</h2>
                <p class="card-desc">화학 원소 주기율표</p>
            </div>
            <div class="card-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </div>
        </a>

        <!-- Card 6: 점프 게임 -->
        <a href="https://dashclone-sepia.vercel.app/" class="hub-card card-6" target="_blank" rel="noopener noreferrer">
            <div class="card-icon">🏃</div>
            <div class="card-content">
                <h2 class="card-title">점프 게임</h2>
                <p class="card-desc">신나는 점프 액션</p>
            </div>
            <div class="card-arrow">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12h14M12 5l7 7-7 7" />
                </svg>
            </div>
        </a>
    </main>
</body>

</html>
